[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    xdist_group(name): mark test to run in serial xdist group (for DB-shared-state safety)
    artifact: requires a committed or locally generated ML artifact
    integration: exercises multiple application components end-to-end
    benchmark: performance benchmark; run separately from correctness gates
    fuzz: opt-in randomized or corpus-backed robustness test
    load: external load-test workload; not collected by pytest
