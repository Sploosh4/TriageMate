services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triagemate
      POSTGRES_PASSWORD: triagemate
      POSTGRES_DB: triagemate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triagemate"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  triagemate:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - triagemate-data:/app/backend/data
    environment:
      # Database — unset = SQLite; set to PostgreSQL URL for production
      - DATABASE_URL=postgresql://triagemate:triagemate@db:5432/triagemate
      # API auth (optional — leave unset for localhost-only)
      - TRIAGEMATE_API_KEY=${TRIAGEMATE_API_KEY:-}
      # LLM provider (optional — KNOWN_CONFLICTS fallback used if unset)
      - TRIAGEMATE_LLM_API_KEY=${TRIAGEMATE_LLM_API_KEY:-}
      - TRIAGEMATE_LLM_PROVIDER=${TRIAGEMATE_LLM_PROVIDER:-openai}
      - TRIAGEMATE_LLM_MODEL=${TRIAGEMATE_LLM_MODEL:-gpt-4o-mini}
      - TRIAGEMATE_LLM_MAX_TOKENS=${TRIAGEMATE_LLM_MAX_TOKENS:-1024}
      - TRIAGEMATE_LLM_TIMEOUT=${TRIAGEMATE_LLM_TIMEOUT:-30}
      # CMDB provider (defaults to stub)
      - TRIAGEMATE_CMDB_PROVIDER=${TRIAGEMATE_CMDB_PROVIDER:-stub}
      # NVD API key (optional — rate-limited without one)
      - NVD_API_KEY=${NVD_API_KEY:-}
      # Automatic retraining (disabled by default — requires explicit opt-in for Gate B)
      - AUTOMATIC_RETRAINING_ENABLED=${AUTOMATIC_RETRAINING_ENABLED:-false}
      # Disable HuggingFace HTTP in container (model pre-cached in image)
      - HF_HUB_OFFLINE=1
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    restart: unless-stopped

volumes:
  triagemate-data:
  pgdata:
